services:
  - type: web
    name: checkers-arena
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: CHECKERS_DB
        value: /tmp/checkers.db
